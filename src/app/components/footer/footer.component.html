<footer class="page-footer blue">
  <div class="container">
    <div class="footer-row">
      <div class="footer-left" appScrollReveal>
        <h5>{{ contact.name }}</h5>
        <p>{{ utils.getName('main_description') }}</p>
      </div>
      <div class="footer-right" appScrollReveal>
        <h5>{{ utils.getName('links') }}</h5>
        <ul>
          <li><a target="_blank" rel="noopener" [href]="contact.github"><img class="icon" alt="github" src="images/github.png">GitHub</a></li>
          <li><a target="_blank" rel="noopener" [href]="contact.stackoverflow"><img class="icon" alt="stackoverflow" src="images/SO.svg">StackOverflow</a></li>
          <li><a target="_blank" rel="noopener" [href]="contact.linkedIn"><img class="icon" alt="linkedIn" src="images/Linkedin.png">LinkedIn</a></li>
          <li><a target="_blank" rel="noopener" [href]="contact.facebook"><img class="icon" alt="Facebook" src="images/facebook.png">Facebook</a></li>
        </ul>
      </div>
    </div>
  </div>
  <div class="footer-copyright">
    <div class="container">&copy; {{ currentYear }} Juan Camilo Rodriguez Duran</div>
  </div>
</footer>
